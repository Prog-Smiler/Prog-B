name: Build ProgB

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install pyinstaller
          pip install customtkinter
          pip install SpeechRecognition
          pip install pyjokes
          pip install edge-tts
          pip install pyaudio

      - name: Build Windows EXE
        run: pyinstaller --onefile --windowed --hidden-import=pyaudio --collect-all=pyaudio gui.py

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: ProgB-Windows
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev ffmpeg

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install pyinstaller
          pip install customtkinter
          pip install SpeechRecognition
          pip install pyjokes
          pip install edge-tts
          pip install pyaudio

      - name: Build Linux Binary
        run: pyinstaller --onefile --hidden-import=pyaudio --collect-all=pyaudio gui.py

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: ProgB-Linux
          path: dist/*